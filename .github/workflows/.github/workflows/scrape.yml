name: Auto Scraper

on:
  schedule:
    - cron: '0 * * * *' # รันทุกๆ 1 ชั่วโมง
  workflow_dispatch:     # อนุญาตให้กดสั่งรันเองผ่านปุ่มในเว็บได้

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas lxml requests

      - name: Run scraper
        run: python Solar_scraping.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add main_Solar_df.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update solar data" && git push)
          # test
